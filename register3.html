<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List UC PUBG MOBILE</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('assets/pubg.jpg');
            background-size: cover;
            background-position: center;
            color: white;
        }
        header {
            background-color: #003543;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        header img {
            height: 50px;
            margin-right: 10px;
        }
        header h1 {
            font-size: 24px;
            color: #ffffff;
            margin: 0;
        }
        .post-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background-color: rgba(0, 0, 0, 0.8);
            color: #fff;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card.active {
            border: 2px solid #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
        }
        .diamond-grid img {
            height: 150px;
            object-fit: cover;
        }
        h3 {
            margin-top: 30px;
            color: #ffffff;
        }
        .form-group label {
            color: #ffffff;
        }
        .btn-success {
            background-color: #f90000;
            border-color: #ffffff;
        }
        .btn-back {
            background-color: #444;
            border-color: #ffffff;
            margin-top: 10px;
        }
        .registration-form {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 10px;
        }
        #dana-number {
            display: none;
        }
        .cart {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div class="container d-flex justify-content-center align-items-center">
            <img src="assets/LOGO RS.png" alt="Mobile Legends Logo">
            <h1>PUBG MOBILE</h1>
        </div>
    </header>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <div class="post-grid" id="uc-list">
                    <div class="card" data-id="1000">
                        <img src="assets/pubg.jpg" alt="1000 UC">
                        <div class="card-body">
                            <h5 class="card-title">1000 UC</h5>
                            <p class="card-text">Rp 150.000</p>
                            <button class="btn btn-success" onclick="addToCart(1000, '1000 UC', 150000)">Add to Cart</button>
                        </div>
                    </div>
                    <div class="card" data-id="2000">
                        <img src="assets/pubg.jpg" alt="2000 UC">
                        <div class="card-body">
                            <h5 class="card-title">2000 UC</h5>
                            <p class="card-text">Rp 300.000</p>
                            <button class="btn btn-success" onclick="addToCart(2000, '2000 UC', 300000)">Add to Cart</button>
                        </div>
                    </div>
                    <div class="card" data-id="5000">
                        <img src="assets/pubg.jpg" alt="5000 UC">
                        <div class="card-body">
                            <h5 class="card-title">5000 UC</h5>
                            <p class="card-text">Rp 750.000</p>
                            <button class="btn btn-success" onclick="addToCart(5000, '5000 UC', 750000)">Add to Cart</button>
                        </div>
                    </div>
                    <div class="card" data-id="10000">
                        <img src="assets/pubg.jpg" alt="10000 UC">
                        <div class="card-body">
                            <h5 class="card-title">10000 UC</h5>
                            <p class="card-text">Rp 1.500.000</p>
                            <button class="btn btn-success" onclick="addToCart(10000, '10000 UC', 1500000)">Add to Cart</button>
                        </div>
                    </div>
                    <div class="card" data-id="20000">
                        <img src="assets/pubg.jpg" alt="20000 UC">
                        <div class="card-body">
                            <h5 class="card-title">20000 UC</h5>
                            <p class="card-text">Rp 3.000.000</p>
                            <button class="btn btn-success" onclick="addToCart(20000, '20000 UC', 3000000)">Add to Cart</button>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="registration-form">
                    <h3 id="registrasi">Registrasi Akun</h3>
                    <form action="submit3.html" method="POST" id="payment-form">
                        <div class="form-group">
                            <label for="nama">USERNAME</label>
                            <input type="text" class="form-control" id="nama" name="nama" required>
                        </div>
                        <div class="form-group">
                            <label for="SERVER">NO TELEPON</label>
                            <input type="text" class="form-control" id="SERVER" name="SERVER" required>
                        </div>
                        <div class="form-group">
                            <label for="pembayaran">Pembayaran</label>
                            <select class="form-control" id="pembayaran" name="pembayaran" required onchange="toggleDanaNumber()">
                                <option value="DANA">DANA</option>
                                <option value="OVO">OVO</option>
                                <option value="GOPAY">GoPay</option>
                            </select>
                        </div>
                        <div class="form-group" id="dana-number">
                            <label for="dana">No. DANA</label>
                            <input type="text" class="form-control" id="dana" name="dana" placeholder="Masukkan nomor DANA" required>
                        </div>
                        <button type="button" class="btn btn-success btn-block" onclick="submitPayment()">Payment</button>
                        <button type="button" class="btn btn-back btn-block" onclick="window.history.back();">Kembali</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="cart" id="cart">
        Cart: <span id="cart-count">0</span> items
        <div id="cart-details"></div>
    </div>

    <script>
        let cart = [];

        function addToCart(id, name, price) {
            const item = { id, name, price };
            cart.push(item);
            updateCart();
        }

        function updateCart() {
            const cartCount = document.getElementById('cart-count');
            const cartDetails = document.getElementById('cart-details');
            cartCount.textContent = cart.length;

            let details = '<ul>';
            cart.forEach(item => {
                details += `<li>${item.name} - Rp ${item.price}</li>`;
            });
            details += '</ul>';

            cartDetails.innerHTML = details;
        }

        function toggleDanaNumber() {
            var paymentMethod = document.getElementById("pembayaran").value;
            var danaField = document.getElementById("dana-number");

            if (paymentMethod === "DANA") {
                danaField.style.display = "block";
                document.getElementById("dana").required = true; 
            } else {
                danaField.style.display = "none";
                document.getElementById("dana").required = false; 
            }
        }

        function submitPayment() {
            const form = document.getElementById("payment-form");

            const cartInput = document.createElement("input");
            cartInput.type = "hidden";
            cartInput.name = "cart";
            cartInput.value = JSON.stringify(cart);
            form.appendChild(cartInput);

            form.submit(); 
        }
    </script>
</body>
</html>
