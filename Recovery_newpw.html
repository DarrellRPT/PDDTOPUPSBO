<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recovery Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>
        footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f2f2f2;
        }
        .logo {
            max-width: 100px;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #003543;
            color: white;
            position: relative;
        }
        body {
            background-image: url('assets/backround.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        main {
            padding-top: 150px;
        }
    </style>

  <body>
    <header>
        <a href="index.html">
            <img src="assets/LOGO RS.png" alt="Logo TopUp Game" class="logo">
        </a>
        <h1>Selamat Datang di TopUp Game</h1>
        <p>Temukan item game terbaik untuk pengalaman bermain yang lebih seru!</p>
    </header>
    <main>
        <div class="container text-center">
            <div class="row justify-content-center">
                <div class="col-7 text-center">
                    <h1>
                        Kata Sandi Baru
                    </h1>
                    <p class="text-body-secondary"> Buat kata sandi yang kuat untuk akun anda
                    </p>
                </div>
                <div class="d-grid gap-2 col-8 mx-auto">
                    <input class="form-control mb-2" type="password" placeholder="Kata Sandi Baru" aria-describedby="passwordHelpBlock" id="inputPw1">
                    <input class="form-control mt-2" type="password" placeholder="Konfirmasi Kata Sandi Baru" aria-describedby="passwordHelpBlock" id="inputPw2">
                    <div id="passwordHelpBlock" class="form-text text-start">
                        Setelah kata sandi dirubah, silahkan masuk kembali dengan kata sandi yang baru
                    </div>
                    <button class="btn btn-primary" type="submit" id="lanjutBtn" onclick="onLanjut()">Lanjut</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; topup game? PDDTOPUP aja!!</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script type="application/javascript">
        let inputPw1 = document.getElementById('inputPw1');
        let inputPw2 = document.getElementById('inputPw2');
        let lanjutBtn = document.getElementById('lanjutBtn');

        function onLanjut() {
            console.log('click');
            if (inputPw1.value == "" && inputPw2.value == "" ) {
                alert('Password tidak boleh kosong!');
            } if (inputPw1.value != inputPw2.value) {
                alert('Password tidak sama!');
            } else {
                window.location.href = "Recovery_success.html";
                localStorage.setItem("password", inputPw1.value);
            }
        }
    </script>
</body>

</html>
