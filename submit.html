<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Submitted</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            background: url(backround.jpg) no-repeat center center fixed;
            background-size: cover;
            color: white;
        }

        header {
            background-color: #003543;
            color: white;
            padding: 10px 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        header img {
            max-width: 150px;
            height: auto;
        }

        main {
            margin: 20px auto;
            width: 60%;
            background-color: #003543;
            padding: 20px;
            border: 1px solid #ffffff;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 6px #ffffff;
        }

        main h2 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: bold;
            text-shadow: 0 2px 4px #003543;
        }

        main p {
            font-size: 1.2em;
            margin: 10px 0;
            text-shadow: 0 1px 3px #003543;
        }

        main a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 1.2em;
            font-weight: bold;
            color: white;
            text-decoration: none;
            background-color: #303030;
            border-radius: 5px;
            box-shadow: 0 3px 5px #ffffff;
            transition: all 0.3s ease;
        }

        main a:hover {
            background-color: #222222;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.6);
        }

        footer {
            background-color: #003543;
            color: white;
            text-align: center;
            padding: 15px 0;
            width: 100%;
            margin-top: auto;
            font-size: 1em;
            font-weight: bold;
            box-shadow: 0 -3px 5px rgb(253, 253, 253);
        }

        @media (max-width: 768px) {
            main {
                width: 80%;
            }
        }

        @media (max-width: 480px) {
            main {
                width: 90%;
            }

            main h2 {
                font-size: 1.8em;
            }

            main p {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

    <header>
        <img src="LOGO RS.png" alt="RS Store">
    </header>

    <main>
        <h2>Terima Kasih!</h2>
        <p>Pesanan Anda telah berhasil diterima.</p>
        <p>Kami akan memproses pesanan Anda segera.</p>
        <a href="index.html">Kembali ke Beranda</a>
    </main>

    <footer>
        <p>&copy; 2024. Topup di RS Store Aja | <a href="#">Kebijakan Privasi</a></p>
    </footer>

</body>
</html>
