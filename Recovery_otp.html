<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recovery Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>
        footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f2f2f2;
        }
        .logo {
            max-width: 100px;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #003543;
            color: white;
            position: relative;
        }
        body {
            background-image: url('assets/backround.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        main {
            padding-top: 150px;
        }
    </style>

  <body>
    <header>
        <a href="index.html">
            <img src="assets/LOGO RS.png" alt="Logo TopUp Game" class="logo">
        </a>
        <h1>Selamat Datang di TopUp Game</h1>
        <p>Temukan item game terbaik untuk pengalaman bermain yang lebih seru!</p>
    </header>
    <main>
        <div class="container text-center">
            <div class="row justify-content-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" fill="currentColor" class="bi bi-envelope-check m-2" viewBox="0 0 16 16">
                <path d="M2 2a2 2 0 0 0-2 2v8.01A2 2 0 0 0 2 14h5.5a.5.5 0 0 0 0-1H2a1 1 0 0 1-.966-.741l5.64-3.471L8 9.583l7-4.2V8.5a.5.5 0 0 0 1 0V4a2 2 0 0 0-2-2zm3.708 6.208L1 11.105V5.383zM1 4.217V4a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v.217l-7 4.2z"></path>
                <path d="M16 12.5a3.5 3.5 0 1 1-7 0 3.5 3.5 0 0 1 7 0m-1.993-1.679a.5.5 0 0 0-.686.172l-1.17 1.95-.547-.547a.5.5 0 0 0-.708.708l.774.773a.75.75 0 0 0 1.174-.144l1.335-2.226a.5.5 0 0 0-.172-.686"></path>
                </svg>
                <div class="col-8 text-center">
                    <h1>
                        Masukan Kode Verifikasi
                    </h1>
                    <p class="text-body-secondary"> Kode verifikasi telah dikirim melalui e-mail
                    </p>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto m-2">
                    <input class="form-control" type="text" placeholder="Masukan kode OTP" aria-label="default input example">
                    <button class="btn btn-primary" type="submit">Lanjut</button>
                    <p class="m-4">Tidak menerima kode? <a href="#" class="text-reset">Kirim ulang</a></p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; topup game? PDDTOPUP aja!!</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>

</html>
