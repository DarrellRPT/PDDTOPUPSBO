<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recovery Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <style>
        footer {
            text-align: center;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #f2f2f2;
        }
        .logo {
            max-width: 100px;
            position: absolute;
            top: 10px;
            left: 10px;
        }
        header {
            text-align: center;
            padding: 20px;
            background-color: #003543;
            color: white;
            position: relative;
        }
        body {
            background-image: url('assets/backround.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        main {
            padding-top: 150px;
        }
    </style>

  <body>
    <header>
        <img src="assets/LOGO RS.png" alt="Logo TopUp Game" class="logo">
        <h1>Selamat Datang di TopUp Game</h1>
        <p>Temukan item game terbaik untuk pengalaman bermain yang lebih seru!</p>
    </header>
    <main>
        <div class="container text-center">
            <div class="row justify-content-center">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-emoji-smile" viewBox="0 0 16 16">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16"/>
                <path d="M4.285 9.567a.5.5 0 0 1 .683.183A3.5 3.5 0 0 0 8 11.5a3.5 3.5 0 0 0 3.032-1.75.5.5 0 1 1 .866.5A4.5 4.5 0 0 1 8 12.5a4.5 4.5 0 0 1-3.898-2.25.5.5 0 0 1 .183-.683M7 6.5C7 7.328 6.552 8 6 8s-1-.672-1-1.5S5.448 5 6 5s1 .672 1 1.5m4 0c0 .828-.448 1.5-1 1.5s-1-.672-1-1.5S9.448 5 10 5s1 .672 1 1.5"/>
                </svg>
                <div class="col-8 text-center m-3">
                    <h1>
                        Kata sandi sudah diubah
                    </h1>
                    <p class="text-body-secondary mt-3"> Pakai kata sandi yang baru untuk masuk lagi ke PDDTOPUP.
                        Jangan bagikan kata sandi ini ke siapapun!
                    </p>
                </div>
                <div class="d-grid gap-2 col-6 mx-auto m-2">
                    <button class="btn btn-primary" type="submit">Lanjut</button>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; topup game? PDDTOPUP aja!!</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>

</html>
